# Тести в контейнерах на окремій тестовій БД (§6)
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cybersphere_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://test:test@db-test:5432/cybersphere_test
      CI: "1"
    depends_on:
      db-test:
        condition: service_healthy
    command: npm run test:ci
