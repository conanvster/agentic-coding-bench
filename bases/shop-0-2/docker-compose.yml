services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersphere}
      POSTGRES_DB: ${POSTGRES_DB:-cybersphere}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersphere}"]
      interval: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cybersphere:cybersphere@db:5432/cybersphere}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data:
